name: apply-site-patch
# يُنفَّذ مرة واحدة عند حفظ هذا الملف: يضيف صفحات الممثلين والمخرجين والأنواع والدول وقسم «أين يُعرض»
on:
  push:
    paths:
      - ".github/workflows/apply-site-patch.yml"
permissions:
  contents: write
concurrency:
  group: elcinema
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PAYLOAD: ""
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: echo "$PAYLOAD" | base64 -d | gunzip > /tmp/patch.py && python3 /tmp/patch.py
      - name: Commit
        run: |
          git config user.name "allcema-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A site
          git diff --cached --quiet || (git commit -m "site: people, genres, countries pages and where-to-watch box" && git pull --rebase && git push)
