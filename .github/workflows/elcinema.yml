name: elcinema-auto
on:
  schedule:
    - cron: "17 */3 * * *"    # كل 3 ساعات: اكتشاف الجديد (يوفّر دقائق Actions)
    - cron: "40 3 * * *"      # يوميًا: مسح كامل + تحقق
  workflow_dispatch:           # تشغيل يدوي من تبويب Actions

permissions:
  contents: write
concurrency:
  group: elcinema
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UA: elcinema-licensed-sync (${{ github.repository_owner }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Hourly update
        if: github.event.schedule != '40 3 * * *'
        run: python elcinema_scraper.py update --data-dir elcinema_data --sitemap --probe-misses 100 --max-new 60 --user-agent "$UA"
      - name: Transform to original content and publish
        if: github.event.schedule != '40 3 * * *'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: python elcinema_publish.py run --data-dir elcinema_data --target "${{ vars.SITE_TARGET || 'jsonl' }}" --status "${{ vars.PUBLISH_STATUS || 'draft' }}" --limit 5
      - name: Episode recaps (elcinema + verified web research)
        if: github.event.schedule != '40 3 * * *'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: python elcinema_recaps.py --data-dir elcinema_data --target "${{ vars.SITE_TARGET || 'jsonl' }}" --status "${{ vars.PUBLISH_STATUS || 'draft' }}" --limit 5 --daily-cap "${{ vars.RECAP_DAILY_CAP || 40 }}" --credit-line "${{ vars.DISCLOSURE_LINE }}"
      - name: Daily backfill + schedules + verify
        if: github.event.schedule == '40 3 * * *'
        run: |
          python elcinema_scraper.py backfill --data-dir elcinema_data --user-agent "$UA"
          python elcinema_scraper.py schedules --data-dir elcinema_data --user-agent "$UA"
          python elcinema_scraper.py verify --fix --data-dir elcinema_data --user-agent "$UA" | tee elcinema_data/verify_report.txt
      - name: Save data to repo
        if: always()
        run: |
          git config user.name "elcinema-bot"; git config user.email "bot@users.noreply.github.com"
          python - <<'PY'
          import glob, sqlite3
          for p in glob.glob("elcinema_data/*.sqlite"):
              c = sqlite3.connect(p); c.execute("PRAGMA wal_checkpoint(TRUNCATE)"); c.close()
          PY
          git add -A elcinema_data
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F_%H:%M)" && git pull --rebase && git push)
