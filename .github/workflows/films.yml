name: egyptian-films
# أعمال مصرية 2026 مؤكدة على elcinema (السنة=2026 والبلد=مصر) رشّحها Gemini: أفلام + مقال لكل مسلسل
# كل عمل يُكتب بصياغة أصلية ويمرّ بحواجز الجودة قبل النشر في site_items.jsonl
on:
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: max new articles per step this run
        default: "12"

permissions:
  contents: write
concurrency:
  group: elcinema
  cancel-in-progress: false

jobs:
  works:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UA: elcinema-licensed-sync (${{ github.repository_owner }})
      FILMS: "2099773 2099520 2096928 2098547 2095662 2100998 2069657 2083144 2083562 2093181 2093302 2093383 2094888 2094988 2095133 2095566 2096111 2096547 2096884 2097608 2098609 2098636 2099772 2099774 2099939"
      SERIES: "2096564 2097096 2097156 2097164 2097293 2097311 2097539 2097858 2097947 2098009 2098016 2098032 2098186 2098485 2098499 2098502 2098528 2098321 2098326 2098497 2098504 2098828 2097584 2097616 2097692 2097753 2096819 2096885 2097068 2097069 2097084 2096187 2096246 2096254 2096453 2096455"
      LLM_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Fetch film pages from elcinema
        run: python elcinema_scraper.py fetch --ids $FILMS --refresh --data-dir elcinema_data --user-agent "$UA"
      - name: Fetch series-level pages from elcinema (no episodes)
        run: python elcinema_scraper.py fetch --ids $SERIES --no-episodes --data-dir elcinema_data --user-agent "$UA"
      - name: Write and publish original film articles
        run: >
          python elcinema_publish.py run --data-dir elcinema_data --no-only-series --only-films
          --work-ids $FILMS --min-year 2026 --countries "مصر" --limit ${{ inputs.limit || 12 }}
          --target jsonl --status "${{ vars.TRACK_STATUS || 'publish' }}"
          --credit-line "${{ vars.DISCLOSURE_LINE }}"
      - name: Write and publish original series articles
        run: >
          python elcinema_publish.py run --data-dir elcinema_data
          --work-ids $SERIES --min-year 2026 --countries "مصر" --limit ${{ inputs.limit || 12 }}
          --target jsonl --status "${{ vars.TRACK_STATUS || 'publish' }}"
          --credit-line "${{ vars.DISCLOSURE_LINE }}"
      - name: Save data to repo
        if: always()
        run: |
          git config user.name "elcinema-bot"; git config user.email "bot@users.noreply.github.com"
          python - <<'PY'
          import glob, sqlite3
          for p in glob.glob("elcinema_data/*.sqlite"):
              c = sqlite3.connect(p); c.execute("PRAGMA wal_checkpoint(TRUNCATE)"); c.close()
          PY
          git add -A elcinema_data
          git diff --cached --quiet || (git commit -m "works: $(date -u +%F_%H:%M)" && git pull --rebase && git push)
