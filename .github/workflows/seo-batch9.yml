name: seo-batch9
# يُنفَّذ مرة واحدة: إظهار بريد التواصل كنص عادي (منع إخفاء Cloudflare له)
on:
  push:
    paths:
      - ".github/workflows/seo-batch9.yml"
permissions:
  contents: write
concurrency:
  group: elcinema
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAYLOAD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Apply patch
        run: echo "$PAYLOAD" | base64 -d | gunzip > /tmp/patch.py && python3 /tmp/patch.py
      - name: Verify build
        working-directory: site
        run: npm install && npm run build
      - name: Commit
        run: |
          git config user.name "allcema-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A site
          git diff --cached --quiet || (git commit -m "site: keep contact email as plain mailto (email_off)" && git pull --rebase && git push)
